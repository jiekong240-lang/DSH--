<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="贾维斯 · 实时对话粒子智能体 (GPU)">
<title>贾维斯 · JARVIS</title>
<link rel="stylesheet" href="/style.css">
<script type="importmap">
{ "imports": { "three": "/lib/three.module.js" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <header id="topbar">
    <div class="brand">
      <div class="logo"><span>◈</span></div>
      <div>
        <h1>贾维斯</h1>
        <span class="sub">JARVIS · GPU PARTICLE</span>
      </div>
    </div>
    <div class="tstats">
      <span>状态<b id="status">就绪</b></span>
      <span>粒子<b id="pcount">--</b></span>
    </div>
  </header>

  <div id="chat">
    <div id="messages"></div>
    <form id="chatForm">
      <input id="input" type="text" placeholder="说点什么…" autocomplete="off" autofocus>
      <button type="submit">发送</button>
    </form>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
